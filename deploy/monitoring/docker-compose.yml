# Prometheus, Loki and Grafana for Tonwerk and other apps, on a machine other than the Mac (a Proxmox LXC or VM with
# Docker and Tailscale): the Mac's memory belongs to the models. See README.md in this folder.
name: monitoring

# Docker keeps a container's stdout in a JSON file without a limit unless told otherwise; Prometheus and Loki keep
# their own data for 90 and 30 days, so this was the one part of the stack that grew forever.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  prometheus:
    logging: *logging
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:9090:9090

  loki:
    logging: *logging
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    ports:
      # Tonwerk pushes its log here (Monitoring:Loki:Url).
      - ${BIND_ADDRESS:-0.0.0.0}:3100:3100

  grafana:
    logging: *logging
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    # The admin's login (GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD) comes from .env, which stays out of git.
    env_file: .env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: de-DE
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/uebersicht.json
      # /metrics for the job stack in prometheus.yml; only reachable inside this compose network and on the port above.
      GF_METRICS_ENABLED: "true"
      # The address in alarm messages; the tailnet name of this container.
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://monitoring:3000/}
      # Alarms go to ntfy (grafana/provisioning/alerting/); the address and topic come from .env. Without them the
      # contact point points nowhere and Grafana shows its failed deliveries under Alerting > Contact points.
      NTFY_URL: ${NTFY_URL:-http://ntfy.invalid}
      NTFY_TOPIC: ${NTFY_TOPIC:-alarme}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:3000:3000
    depends_on:
      - prometheus
      - loki

  # Asks websites and health endpoints on Prometheus' behalf (job probes). No published port: only Prometheus needs it.
  blackbox:
    logging: *logging
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro

  # Proxmox: every LXC's and VM's CPU, memory and disk through the host's API (job proxmox). Its read-only token
  # (PVEAuditor) is in pve.yml beside .env, mode 600, never in git; proxmox-lxc.sh with PVE_EXPORTER=1 makes both and
  # turns the profile on (COMPOSE_PROFILES=pve in .env). No published port: only Prometheus reaches it.
  pve-exporter:
    logging: *logging
    image: prompve/prometheus-pve-exporter:3.10.1
    restart: unless-stopped
    profiles: [pve]
    # Its default [::]:9221 fails where Docker gives the container no IPv6; Prometheus reaches it over IPv4 anyway.
    command: --web.listen-address=0.0.0.0:9221
    volumes:
      - ./pve.yml:/etc/prometheus/pve.yml:ro

volumes:
  prometheus:
  loki:
  grafana:
