# Prometheus, Loki and Grafana for Tonwerk and other apps, on a machine other than the Mac (a Proxmox LXC or VM with
# Docker and Tailscale): the Mac's memory belongs to the models. See README.md in this folder.
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:9090:9090

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    ports:
      # Tonwerk pushes its log here (Monitoring:Loki:Url).
      - ${BIND_ADDRESS:-0.0.0.0}:3100:3100

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    # The admin's login (GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD) comes from .env, which stays out of git.
    env_file: .env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: de-DE
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tonwerk.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:3000:3000
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus:
  loki:
  grafana:
