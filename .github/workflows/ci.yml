name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Backend build and test
    # The tests replace YuE Studio's worker with a scripted fake, so they need neither macOS nor the model.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # A Release build skips the npm install of the Debug build; the publish job covers the frontend.
      - name: Build
        run: dotnet build --configuration "$CONFIGURATION" --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --configuration "$CONFIGURATION" --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  publish:
    name: Web frontend and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/YueUI.Api/ClientApp/package-lock.json

      # The publish target runs npm ci and npm run build (vue-tsc type check + Vite bundle)
      # and ships the frontend as wwwroot/ui, exactly as deploy/install.sh does.
      - name: Publish API with web frontend
        run: dotnet publish src/YueUI.Api --configuration "$CONFIGURATION" --output out/publish

      - name: Check published web frontend
        run: |
          test -f out/publish/wwwroot/ui/index.html
          ls out/publish/wwwroot/ui/assets/*.js

  swift-kit:
    name: TonwerkKit (Swift)
    # The apps' shared package: the client generated from the OpenAPI description must build and decode real answers.
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apple/TonwerkKit

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The app itself, for both platforms, unsigned. The package's OpenAPI generator is a build plugin, which Xcode
      # asks to trust once; here the flag does.
      - name: Build the app for macOS
        working-directory: apple
        run: >-
          xcodebuild build -project Tonwerk.xcodeproj -scheme Tonwerk -destination 'generic/platform=macOS'
          -derivedDataPath build -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet

      # The Dock and Finder show the icon only if the asset catalog compiled it into the bundle and Info.plist names it.
      - name: Check the Mac app's icon
        working-directory: apple
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name Tonwerk-AI.app -type d | head -1)
          echo "$app"
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIcon(Name|File)'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" = AppIcon
          ls -l "$app/Contents/Resources/"
          test -s "$app/Contents/Resources/AppIcon.icns"
          xcrun assetutil --info "$app/Contents/Resources/Assets.car" | grep -c '"Name" : "AppIcon"'

      # The app speaks German and English: the string catalogs must reach the bundle, and a language it does not have
      # falls back to English (the development region).
      - name: Check the Mac app's languages
        working-directory: apple
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name Tonwerk-AI.app -type d | head -1)
          ls -d "$app"/Contents/Resources/*.lproj
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDevelopmentRegion' "$app/Contents/Info.plist")" = en
          plutil -p "$app/Contents/Resources/en.lproj/Localizable.strings" | grep -F '"Bibliothek" => "Library"'
          plutil -p "$app/Contents/Resources/de.lproj/Localizable.strings" | grep -F '"Bibliothek" => "Bibliothek"'
          plutil -p "$app/Contents/Resources/en.lproj/InfoPlist.strings" | grep -F NSMicrophoneUsageDescription

      - name: Build the app for iPhone
        working-directory: apple
        run: >-
          xcodebuild build -project Tonwerk.xcodeproj -scheme Tonwerk -destination 'generic/platform=iOS'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet

  app-texts:
    name: App texts (English)
    # Every text the app's screens look up needs an English translation in apple/Tonwerk/Localizable.xcstrings. The
    # screens live in the TonwerkUI package, whose texts Xcode does not extract into the app's catalog, so the compiler
    # writes them here and apple/Support/localizations.py holds the catalog to them. A job of its own keeps its log short.
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apple/TonwerkKit

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Extract the app's texts
        run: >-
          swift build --target TonwerkUI -Xswiftc -emit-localized-strings
          -Xswiftc -emit-localized-strings-path -Xswiftc "$RUNNER_TEMP/strings" > "$RUNNER_TEMP/build.log" 2>&1
          || (tail -50 "$RUNNER_TEMP/build.log"; exit 1)

      - name: Check English translations
        run: |
          python3 ../Support/localizations.py places "$RUNNER_TEMP/strings"
          python3 ../Support/localizations.py check "$RUNNER_TEMP/strings" ../Tonwerk/Localizable.xcstrings

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/YueUI.Api/ClientApp

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/YueUI.Api/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      # Against the Vite dev server with /api answered in the page (e2e/fakeApi.ts); no .NET server needed.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/YueUI.Api/ClientApp/playwright-report/
            src/YueUI.Api/ClientApp/test-results/
          retention-days: 7
