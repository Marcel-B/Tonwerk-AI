apiVersion: 1
# Every alarm goes to ntfy, around the clock (the phone decides about quiet hours). One message per rule and app; a
# rule still firing is said again after 12 hours.
policies:
  - orgId: 1
    receiver: ntfy
    group_by: [alertname, app, instance]
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 12h
