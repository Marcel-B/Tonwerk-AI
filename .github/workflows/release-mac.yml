# Builds the Mac app Tonwerk-AI for download outside the App Store: signed with Developer ID, notarized by Apple and
# packed into a DMG, attached to a GitHub release with the tag app-v<version> (the server goes out through main, so its
# commits carry no tags; "app-" keeps the two apart). It runs by itself after CI passed on main: the job "plan"
# (.github/scripts/app-release-plan.py) releases only when apple/, LICENSE or NOTICE changed since the newest tag,
# takes the next version (major stays, minor for new functions, patch otherwise) and the notes users see in the update
# window, both from Claude when ANTHROPIC_API_KEY is set, else a patch with the changes' titles. By hand (Actions →
# Mac-App veröffentlichen → Run workflow) a version and notes can be given; without them it plans like after CI.
# After the Mac release, the job "testflight" uploads the iPhone and iPad app of the same commit and version
# (testflight.yml, with its secrets), so TestFlight follows each release.
# Needs the repository secrets (the same values as in
# Marcel-B/Synth, whose release uses the same certificate)
#   MACOS_CERTIFICATE_P12        the "Developer ID Application" certificate with its key, as .p12, base64-encoded
#   MACOS_CERTIFICATE_PASSWORD   the .p12's password
#   APPLE_ID                     the Apple ID of the developer account
#   APPLE_APP_PASSWORD           an app-specific password of that Apple ID (account.apple.com), for notarytool
#   APPLE_TEAM_ID                the team id (also used by testflight.yml)
#   SPARKLE_PRIVATE_KEY          the EdDSA key that signs updates (bin/generate_keys -x of Sparkle's release, the file's text)
#   SPARKLE_PUBLIC_ED_KEY        its public half, which generate_keys prints; it goes into the app's Info.plist
#   ANTHROPIC_API_KEY            optional, for the version kind and the notes (Claude Opus 5.5, a few cents a release)
# Besides the DMG the release carries appcast.xml, which the app's updater (Updates.swift) reads from the newest
# release; so every release must come from here, a DMG made by hand would carry no signature the app accepts.
# Unlike the Synth release there is no ad-hoc fallback: a download macOS refuses to open helps no one.
name: Mac-App veröffentlichen

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 1.2.0 (leer: wie nach CI bestimmen)"
        required: false
        type: string
      notes:
        description: "Was neu ist (eine Zeile, leer: aus den Änderungen)"
        required: false
        type: string

permissions:
  contents: write

# One release at a time, none cancelled: a second run waits and then finds the first one's tag.
concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  plan:
    name: Neue Version?
    # After CI only for its pushes to main that passed; a pull request's run never releases.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      notes_md: ${{ steps.plan.outputs.notes_md }}
      notes_html: ${{ steps.plan.outputs.notes_html }}
      sha: ${{ steps.sha.outputs.sha }}
      build: ${{ steps.sha.outputs.build }}
    steps:
      - id: sha
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          # The iPhone build's number for TestFlight, apart from testflight.yml's own runs (1000 + their number).
          echo "build=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet anthropic pydantic
      - id: plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: python .github/scripts/app-release-plan.py "${{ steps.sha.outputs.sha }}" --version "$VERSION" --notes "$NOTES"

  release:
    name: Signieren, notarisieren, veröffentlichen
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      VERSION: ${{ needs.plan.outputs.version }}
      NOTES_MD: ${{ needs.plan.outputs.notes_md }}
      NOTES_HTML: ${{ needs.plan.outputs.notes_html }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Check the inputs and secrets
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_ED_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::secret $name is missing"; missing=1; }
          done
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::version '$VERSION' is not like 0.2.0"; missing=1; }
          if git ls-remote --exit-code --tags origin "refs/tags/app-v$VERSION" >/dev/null; then
            echo "::error::app-v$VERSION exists already; take a new version"; missing=1
          fi
          exit $missing

      # The same Xcode choice as testflight.yml, so both platforms build with one SDK.
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          version=$(basename "$xcode" .app); version=${version#Xcode_}
          (( ${version%%.*} >= 26 )) || { echo "::error::no Xcode 26 on the runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Import the Developer ID certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [[ -n "$IDENTITY" ]] || { echo "::error::the certificate holds no 'Developer ID Application' identity"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Signed in the archive itself: the app's entitlements (sandbox, network, microphone, Bluetooth, chosen files)
      # need no provisioning profile under Developer ID, so no export step with profiles is needed. The identity
      # goes in through -xcconfig, since xcodebuild cannot take a conditional setting on its command line (it read
      # "CODE_SIGN_IDENTITY[sdk=macosx*]=…" as the identity "macosx*]=…"), and only a conditional one at a level
      # above Signing.xcconfig surely beats its ad-hoc "[sdk=macosx*] = -". The build number is the run number, so
      # every release counts up for the update check.
      - name: Archive
        working-directory: apple
        run: |
          printf 'CODE_SIGN_IDENTITY = %s\nCODE_SIGN_IDENTITY[sdk=macosx*] = %s\n' "$SIGN_IDENTITY" "$SIGN_IDENTITY" \
            > "$RUNNER_TEMP/signing.xcconfig"
          xcodebuild archive -project Tonwerk.xcodeproj -scheme Tonwerk -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/Tonwerk-AI.xcarchive" \
            -skipPackagePluginValidation -xcconfig "$RUNNER_TEMP/signing.xcconfig" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER= \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN" ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -50; tail -100 "$RUNNER_TEMP/archive.log"; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
          mkdir -p "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/Tonwerk-AI.xcarchive/Products/Applications/Tonwerk-AI.app" "$RUNNER_TEMP/dmg/Tonwerk-AI.app"
          echo "APP=$RUNNER_TEMP/dmg/Tonwerk-AI.app" >> "$GITHUB_ENV"

      # Xcode re-signs Sparkle.framework when it copies it, but not the helpers inside it, which notarization wants
      # under the same Developer ID with the hardened runtime and a timestamp. Sparkle's documentation lists these
      # commands; inside out, then the app again with its own entitlements.
      - name: Sign Sparkle's helpers
        run: |
          sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$@"; }
          FRAMEWORK="$APP/Contents/Frameworks/Sparkle.framework"
          test -d "$FRAMEWORK" || { echo "::error::Sparkle.framework is not in the app"; ls "$APP/Contents/Frameworks"; exit 1; }
          sign "$FRAMEWORK/Versions/B/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$FRAMEWORK/Versions/B/XPCServices/Downloader.xpc"
          sign "$FRAMEWORK/Versions/B/Autoupdate"
          sign "$FRAMEWORK/Versions/B/Updater.app"
          sign "$FRAMEWORK"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/app.entitlements"
          sign --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"

      - name: Check the signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Developer ID Application|Timestamp=|flags=.*runtime"
          codesign -d --entitlements - --xml "$APP" | plutil -p - | tee "$RUNNER_TEMP/entitlements.txt"
          grep -Eq '"com.apple.security.app-sandbox" => (true|1)$' "$RUNNER_TEMP/entitlements.txt"
          grep -q 'de.bvelop.tonwerk.ai-spki' "$RUNNER_TEMP/entitlements.txt"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist")"
          if grep -q 'get-task-allow' "$RUNNER_TEMP/entitlements.txt"; then echo "::error::debug entitlement in a release"; exit 1; fi
          lipo -archs "$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"

      - name: Notarize the app
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/app.zip"
          # Stapled, the app opens without a network check, also when copied out of the DMG.
          .github/scripts/staple.sh "$APP"
          spctl -a -vv -t exec "$APP"

      - name: DMG
        run: |
          cp LICENSE NOTICE "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Programme"
          mkdir dist
          DMG="dist/Tonwerk-AI-$VERSION.dmg"
          hdiutil create -volname "Tonwerk-AI $VERSION" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "$DMG"
          codesign --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" --timestamp "$DMG"
          .github/scripts/notarize.sh "$DMG"
          .github/scripts/staple.sh "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          # A copy under a name without the version, so tonwerk.studio can always link
          # releases/latest/download/Tonwerk-AI.dmg.
          cp "$DMG" dist/Tonwerk-AI.dmg
          shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS.txt

      # The feed the app's updater reads: one entry, this release, its DMG signed with the update key. Sparkle's tools
      # come from its release of the version the app links (Package.resolved).
      - name: Appcast
        run: |
          sparkle=$(plutil -extract pins json -o - apple/Tonwerk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            | python3 -c 'import json,sys; print(next(p["state"]["version"] for p in json.load(sys.stdin) if p["identity"] == "sparkle"))')
          mkdir "$RUNNER_TEMP/sparkle"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle/Sparkle-$sparkle.tar.xz" | tar -xJ -C "$RUNNER_TEMP/sparkle"
          key="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          signature=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$key" "dist/Tonwerk-AI-$VERSION.dmg")
          rm "$key"
          echo "$signature"
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Tonwerk-AI</title>
              <item>
                <title>Tonwerk-AI $VERSION</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <description><![CDATA[$NOTES_HTML<p><a href="https://github.com/Marcel-B/Tonwerk-AI/releases/tag/app-v$VERSION">Alle Änderungen</a></p>]]></description>
                <enclosure url="https://github.com/Marcel-B/Tonwerk-AI/releases/download/app-v$VERSION/Tonwerk-AI-$VERSION.dmg" type="application/octet-stream" $signature/>
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout dist/appcast.xml
          cat dist/appcast.xml

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          news="**Neu:**"$'\n'"$NOTES_MD"$'\n\n'
          gh release create "app-v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Tonwerk-AI $VERSION für Mac" --notes "$(cat <<NOTES
          ${news}**Mac** (\`Tonwerk-AI-$VERSION.dmg\`): die App für macOS 14 und neuer, Apple Silicon und Intel. DMG öffnen und Tonwerk-AI in den Ordner Programme ziehen. Sie ist mit Developer ID signiert und von Apple notarisiert; macOS öffnet sie ohne Rückfrage.

          Die App erzeugt selbst nichts: Sie steuert einen Tonwerk-AI-Server auf einem Mac mit Apple Silicon, den du selbst betreibst. Ohne Server zeigt **Ohne Server ausprobieren** eine Beispielbibliothek. Einrichtung: https://tonwerk.studio/ai/einrichtung.html

          Songs, Stimmen, Bilder und Texte, die mit Tonwerk-AI entstehen, sind KI-erzeugt; was das heißt, steht auf https://tonwerk.studio/ai/. Lizenz: PolyForm Noncommercial 1.0.0 (LICENSE, NOTICE im DMG).
          NOTES
          )"

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  testflight:
    name: iPhone-App zu TestFlight
    # After the Mac release, so a TestFlight build always has its tag; a failed Mac release uploads nothing and the
    # next run plans the same version again.
    needs: [plan, release]
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.sha }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit
