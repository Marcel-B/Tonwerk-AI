# The one way into Loki for devices outside the tailnet (the desk buddy, a Pi on the home Wi-Fi): only
# POST /loki/api/v1/push, only with a password from htpasswd beside this file (loki-push-user.sh writes it; it stays
# out of git). Reading stays with Grafana. Loki's own port 3100 is unchanged for the apps in the tailnet.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  access_log off;
  server_tokens off;

  server {
    listen 3101;

    # A device that was cut off sends its backlog at once (the desk buddy keeps up to 20 000 lines).
    client_max_body_size 16m;

    location = /loki/api/v1/push {
      limit_except POST {
        deny all;
      }
      auth_basic "Loki";
      # Read on every request: a new password needs no reload. Without the file every push is refused (500).
      auth_basic_user_file /etc/nginx/loki-push/htpasswd;
      proxy_pass http://loki:3100;
      proxy_set_header Authorization "";
    }

    location / {
      return 404;
    }
  }
}
