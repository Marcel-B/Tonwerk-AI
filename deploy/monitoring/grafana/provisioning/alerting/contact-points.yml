apiVersion: 1
# Onkel Bummel (github.com/Marcel-B/onkel-bummel), Marcel's own push service, through its Grafana webhook: it reads the
# webhook's JSON itself (firing → "Alarm: <alertname>" at priority 4, resolved → "Wieder gut: …" at 2, the summaries as
# text, the Grafana link to click), so the contact point needs no templates. Address and publish token (restricted to
# the topic alarme) come from the container's environment (.env: ONKELBUMMEL_URL, ONKELBUMMEL_TOKEN).
contactPoints:
  - orgId: 1
    name: onkelbummel
    receivers:
      - uid: onkelbummel
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${ONKELBUMMEL_URL}/api/v1/webhooks/grafana?topic=alarme
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${ONKELBUMMEL_TOKEN}

# The contact point and template that sent alarms to ntfy on slipways-1 until 2026-11; provisioned resources are not
# removed when their file entry goes, so they are deleted here.
deleteContactPoints:
  - orgId: 1
    uid: ntfy

deleteTemplates:
  - orgId: 1
    name: ntfy
